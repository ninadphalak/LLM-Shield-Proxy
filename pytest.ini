[pytest]
# Prefer the in-tree benchmark package over any older user/site installation. This makes
# `python -m pytest` reproducible from the repository root without a shell-specific
# PYTHONPATH prefix.
pythonpath = pii-leak-benchmark
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
markers =
    slow: integration or network-backed checks excluded from the default fast path

