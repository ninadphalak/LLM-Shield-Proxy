[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-shield-proxy"
version = "1.3.6"
description = "Streaming privacy gateway for configurable PII transformation and OpenAI-compatible proxy traffic."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    {name = "Ninad Phalak", email = "ninadphalak@gmail.com"}
]
maintainers = [
    {name = "Ninad Phalak", email = "ninadphalak@gmail.com"}
]
keywords = [
    "llm",
    "pii",
    "redaction",
    "privacy",
    "proxy",
    "fastapi",
    "streaming",
    "soc2",
    "hipaa"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# `pip install llm-shield-proxy` installs the GATEWAY. It did, then for one
# unpublished round it did not: the base install was reduced to the conformance
# harness and the gateway moved to a `[proxy]` extra, so that measuring somebody
# else's gateway did not mean installing this one.
#
# That solved the right problem the wrong way round. The harness is the neutral
# measurer and this proxy is one of the things it measures, so the harness is now its
# own distribution with its own name -- `pii-leak-benchmark` -- and this one is the
# gateway again. A benchmark named after one of the products it scores cannot referee
# them, and no third party should have to install a competing gateway to run it.
#
# The dependency below runs one way only. This package may use the benchmark (the
# local profile writes its report and attestation block with it, and it is what
# `llm-shield-proxy benchmark` self-tests against). The benchmark never imports this
# package, and `tests/conformance/test_harness_install_weight.py` fails if it does.
dependencies = [
    "pii-leak-benchmark>=0.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "jsonschema>=4.0.0",
    "httpx[http2]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "orjson>=3.9.0",
    "faker>=18.0.0",
    "prometheus-client>=0.17.0",
    "watchdog>=3.0.0",
    "cryptography>=41.0.0",
    "google-re2>=1.1.20231101",
    "cachetools>=5.3.0",
    # Not optional in practice: security/tool_rbac.py imports redis.asyncio at module
    # scope and api/main.py imports tool_rbac, so `pip install llm-shield-proxy`
    # followed by `llm-shield-proxy --host ...` died with ModuleNotFoundError on a
    # stock install. requirements.txt has always had it, which is why the container
    # and CI never saw this; tests/ootb/test_pypi_cli.py now imports the ASGI app from
    # a wheel-only virtualenv so the gap cannot reopen.
    "redis>=5.0.0",
    "grpclib>=0.4.3",
    "betterproto>=2.0.0b6",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0"
]

[project.optional-dependencies]
redis = [
    "redis>=5.0.0"
]
ner = [
    "onnxruntime>=1.17.0",
    "tokenizers>=0.15.0",
    "numpy>=1.21.0"
]
onnx = [
    "onnxruntime>=1.17.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.24.0",
    "pytest-mock>=3.10.0",
    # tests/test_spec_schema.py validates emitted reports against spec/v1.0.0/.
    # Undeclared, it silently skips and the published envelopes go unchecked.
    "jsonschema>=4.0.0",
    "openai>=1.0.0",
    "psutil>=5.0.0",
    "redis>=5.0.0",
    "build",
    "twine",
    "bump-my-version>=0.20.0"
]

[project.urls]
Homepage = "https://github.com/ninadphalak/LLM-Shield-Proxy"
Repository = "https://github.com/ninadphalak/LLM-Shield-Proxy"
"Bug Tracker" = "https://github.com/ninadphalak/LLM-Shield-Proxy/issues"

[project.scripts]
# Dispatches operator subcommands (and --help) before importing the ASGI server,
# then delegates to api/cli.py for serving.
#
# There is deliberately no conformance entry point here. The harness ships as
# `pii-leak-benchmark`, whose console script is `pii-leak-benchmark`.
llm-shield-proxy = "llm_shield_proxy.cli:main"

[tool.setuptools.packages.find]
include = ["llm_shield_proxy*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
]
ignore = [
    "E501", # line length handled by formatter
]

# Note: the `pii-leak-benchmark` distribution in ./pii-leak-benchmark versions
# independently of the gateway. It is not listed here on purpose -- the measurer and
# the measured must not be forced to move together.
[tool.bumpversion]
current_version = "1.3.6"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "llm_shield_proxy/api/main.py"
search = 'APP_VERSION = "{current_version}"'
replace = 'APP_VERSION = "{new_version}"'

[[tool.bumpversion.files]]
filename = "deploy/helm/llm-shield-proxy/Chart.yaml"
search = 'appVersion: "{current_version}"'
replace = 'appVersion: "{new_version}"'

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.*:",
    "ignore::DeprecationWarning:starlette.*:",
]
