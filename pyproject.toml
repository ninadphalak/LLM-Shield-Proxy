[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-shield-proxy"
version = "1.3.4"
description = "Streaming privacy gateway for configurable PII transformation and OpenAI-compatible proxy traffic."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    {name = "Ninad Phalak", email = "ninadphalak@gmail.com"}
]
maintainers = [
    {name = "Ninad Phalak", email = "ninadphalak@gmail.com"}
]
keywords = [
    "llm",
    "pii",
    "redaction",
    "privacy",
    "proxy",
    "fastapi",
    "streaming",
    "soc2",
    "hipaa"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# The BASE install is the conformance harness, not the proxy.
#
# The harness is the neutral measurer; the proxy is one of the things it measures.
# Asking an engineer at another gateway to install a competing gateway's full stack --
# OpenTelemetry, redis, faker, google-re2, the ASGI server -- in order to run a neutral
# benchmark against their own product is the concrete blocker on getting outside runs,
# and outside runs are the entire point of publishing the harness.
#
# So: `pip install llm-shield-proxy` gives stdlib + httpx and the `llm-shield-conformance`
# command. `pip install llm-shield-proxy[proxy]` gives the gateway and the
# `llm-shield-proxy` server command. A regression test installs the base into a clean
# virtualenv and runs the HTTP profile from it, because this file has been wrong before
# while the import graph was right.
dependencies = [
    "httpx>=0.24.0"
]

[project.optional-dependencies]
# Everything the reference proxy needs. This was the old unconditional dependency list.
proxy = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "jsonschema>=4.0.0",
    "httpx[http2]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "orjson>=3.9.0",
    "faker>=18.0.0",
    "prometheus-client>=0.17.0",
    "watchdog>=3.0.0",
    "cryptography>=41.0.0",
    "google-re2>=1.1.20231101",
    "cachetools>=5.3.0",
    "grpclib>=0.4.3",
    "betterproto>=2.0.0b6",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0"
]
# Validating an emitted report against spec/v1.0.0/ before publishing a row. Optional
# because the harness does not need it to produce the report, only to check it.
harness-validate = [
    "jsonschema>=4.0.0"
]
redis = [
    "redis>=5.0.0"
]
ner = [
    "onnxruntime>=1.17.0",
    "tokenizers>=0.15.0",
    "numpy>=1.21.0"
]
onnx = [
    "onnxruntime>=1.17.0"
]
dev = [
    # Self-referential: the test suite exercises the proxy as well as the harness, so
    # `pip install -e .[dev]` must still produce a complete environment.
    "llm-shield-proxy[proxy]",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.24.0",
    "pytest-mock>=3.10.0",
    # tests/test_spec_schema.py validates emitted reports against spec/v1.0.0/.
    # Undeclared, it silently skips and the published envelopes go unchecked.
    "jsonschema>=4.0.0",
    "openai>=1.0.0",
    "psutil>=5.0.0",
    "redis>=5.0.0",
    "build",
    "twine",
    "bump-my-version>=0.20.0"
]

[project.urls]
Homepage = "https://github.com/ninadphalak/LLM-Shield-Proxy"
Repository = "https://github.com/ninadphalak/LLM-Shield-Proxy"
"Bug Tracker" = "https://github.com/ninadphalak/LLM-Shield-Proxy/issues"

[project.scripts]
# Dispatches operator subcommands (and --help) without importing the ASGI server, then
# delegates to api/cli.py for serving, which needs the [proxy] extra.
llm-shield-proxy = "llm_shield_proxy.cli:main"
# The harness command. Runs on the base install: stdlib + httpx, no proxy.
llm-shield-conformance = "llm_shield_proxy.cli:conformance_main"

[tool.setuptools.packages.find]
include = ["llm_shield_proxy*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.bumpversion]
current_version = "1.3.4"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "llm_shield_proxy/api/main.py"
search = 'APP_VERSION = "{current_version}"'
replace = 'APP_VERSION = "{new_version}"'

[[tool.bumpversion.files]]
filename = "README.md"
search = 'version":"{current_version}"'
replace = 'version":"{new_version}"'

[[tool.bumpversion.files]]
filename = "README.md"
search = "v{current_version}.zip"
replace = "v{new_version}.zip"

[[tool.bumpversion.files]]
filename = "deploy/helm/llm-shield-proxy/Chart.yaml"
search = 'appVersion: "{current_version}"'
replace = 'appVersion: "{new_version}"'

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.*:",
    "ignore::DeprecationWarning:starlette.*:",
]
