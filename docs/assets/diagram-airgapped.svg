<svg width="950" height="280" viewBox="0 0 950 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 500; fill: #1e293b; }
      .text-light { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 500; fill: #ffffff; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .vpc-box { fill: #f4f4f9; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 6; rx: 12; }
      .app-node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .proxy-node { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; rx: 8; }
      .egress-node { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; rx: 8; }
      .llm-node { fill: #1e293b; stroke: #64748b; stroke-width: 2; }
      .arrow-line { stroke: #3b82f6; stroke-width: 2.5; fill: none; }
      .arrow-head { fill: #3b82f6; }
      .arrow-dashed { stroke: #3b82f6; stroke-width: 2.5; fill: none; stroke-dasharray: 4 4; }
      .label-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; font-weight: 600; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
    </marker>
  </defs>

  <!-- VPC Boundary -->
  <rect x="20" y="20" width="700" height="240" class="vpc-box" />
  <text x="40" y="50" class="title">Air-Gapped Corporate VPC</text>

  <!-- Nodes -->
  <!-- App -->
  <rect x="50" y="100" width="160" height="80" class="app-node" />
  <text x="130" y="145" text-anchor="middle" class="text">Browser / IDE</text>
  
  <!-- Proxy -->
  <rect x="300" y="100" width="160" height="80" class="proxy-node" />
  <text x="380" y="145" text-anchor="middle" class="text">LLM-Shield-Proxy 🛡️</text>

  <!-- Egress -->
  <rect x="540" y="100" width="160" height="80" class="egress-node" />
  <text x="620" y="145" text-anchor="middle" class="text">Egress Gateway *</text>

  <!-- LLM -->
  <circle cx="845" cy="140" r="75" class="llm-node" />
  <text x="845" y="135" text-anchor="middle" class="text-light">To OpenAI, Claude,</text>
  <text x="845" y="155" text-anchor="middle" class="text-light">Gemini...</text>

  <!-- Arrows -->
  <!-- App to Proxy -->
  <path d="M 210 125 L 290 125" class="arrow-line" marker-end="url(#arrow)" />
  <text x="250" y="115" text-anchor="middle" class="label-text">Prompt</text>
  
  <!-- Proxy to App (Return) -->
  <path d="M 290 155 L 210 155" class="arrow-dashed" marker-end="url(#arrow)" />
  <text x="250" y="175" text-anchor="middle" class="label-text">Rehydrated</text>

  <!-- Proxy to Egress -->
  <path d="M 460 125 L 530 125" class="arrow-line" marker-end="url(#arrow)" />
  <text x="495" y="115" text-anchor="middle" class="label-text">Sanitized</text>

  <!-- Egress to Proxy (Return) -->
  <path d="M 530 155 L 460 155" class="arrow-dashed" marker-end="url(#arrow)" />
  <text x="495" y="175" text-anchor="middle" class="label-text">Reply</text>

  <!-- Egress to LLM -->
  <path d="M 700 125 L 760 125" class="arrow-line" marker-end="url(#arrow)" />
  <text x="730" y="115" text-anchor="middle" class="label-text">Forward</text>

  <!-- LLM to Egress (Return) -->
  <path d="M 760 155 L 700 155" class="arrow-dashed" marker-end="url(#arrow)" />
  <text x="730" y="175" text-anchor="middle" class="label-text">Reply</text>

</svg>
