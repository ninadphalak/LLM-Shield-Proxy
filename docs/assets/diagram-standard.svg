<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 500; fill: #1e293b; }
      .text-light { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 500; fill: #ffffff; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .vpc-box { fill: transparent; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 6; rx: 12; }
      .app-node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .proxy-node { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; rx: 8; }
      .llm-node { fill: #1e293b; stroke: #64748b; stroke-width: 2; }
      .arrow-line { stroke: #3b82f6; stroke-width: 2.5; fill: none; }
      .arrow-head { fill: #3b82f6; }
      .arrow-dashed { stroke: #3b82f6; stroke-width: 2.5; fill: none; stroke-dasharray: 4 4; }
      .label-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #334155; font-weight: 700; }

      @media (prefers-color-scheme: dark) {
        .text { fill: #f8fafc; }
        .title { fill: #f1f5f9; }
        .vpc-box { stroke: #475569; }
        .app-node { fill: #0f172a; stroke: #334155; }
        .proxy-node { fill: #022c22; stroke: #10b981; }
        .llm-node { fill: #0f172a; stroke: #334155; }
        .label-text { fill: #cbd5e1; }
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
    </marker>
  </defs>

  <!-- VPC Boundary -->
  <rect x="20" y="20" width="560" height="240" class="vpc-box" />
  <text x="40" y="50" class="title">Corporate VPC / Secure Boundary</text>

  <!-- Nodes -->
  <!-- App -->
  <rect x="50" y="100" width="180" height="80" class="app-node" />
  <text x="140" y="145" text-anchor="middle" class="text">Browser / IDE / LangChain</text>
  
  <!-- Proxy -->
  <rect x="360" y="100" width="180" height="80" class="proxy-node" />
  <text x="450" y="145" text-anchor="middle" class="text">LLM-Shield-Proxy 🛡️🔒</text>

  <!-- LLM -->
  <circle cx="750" cy="140" r="75" class="llm-node" />
  <text x="750" y="135" text-anchor="middle" class="text-light">OpenAI, Claude,</text>
  <text x="750" y="155" text-anchor="middle" class="text-light">Gemini...</text>

  <!-- Arrows -->
  <!-- App to Proxy -->
  <path d="M 230 125 L 350 125" class="arrow-line" marker-end="url(#arrow)" />
  <text x="290" y="115" text-anchor="middle" class="label-text">Prompt with PII</text>
  
  <!-- Proxy to App (Return) -->
  <path d="M 350 155 L 230 155" class="arrow-dashed" marker-end="url(#arrow)" />
  <text x="290" y="175" text-anchor="middle" class="label-text">Rehydrated Stream</text>

  <!-- Proxy to LLM -->
  <path d="M 540 125 L 665 125" class="arrow-line" marker-end="url(#arrow)" />
  <text x="602" y="115" text-anchor="middle" class="label-text">Sanitized Prompt</text>

  <!-- LLM to Proxy (Return) -->
  <path d="M 665 155 L 540 155" class="arrow-dashed" marker-end="url(#arrow)" />
  <text x="602" y="175" text-anchor="middle" class="label-text">Streaming Reply</text>

</svg>
