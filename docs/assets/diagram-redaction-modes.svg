<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 500; fill: #1e293b; }
      .text-light { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 500; fill: #ffffff; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 500; fill: #64748b; font-style: italic; }
      .vpc-box { fill: transparent; stroke: #94a3b8; stroke-width: 1.5; rx: 12; }
      .app-node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .synthetic-node { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; rx: 8; }
      .structural-node { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; rx: 8; }
      .arrow-line { stroke: #94a3b8; stroke-width: 2; fill: none; }
      .arrow-head { fill: #94a3b8; }
      .label-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #334155; font-weight: 700; }
      .code-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #ef4444; }
      .code-text-clean { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #10b981; }

      @media (prefers-color-scheme: dark) {
        .text { fill: #f8fafc; }
        .title { fill: #f1f5f9; }
        .subtitle { fill: #94a3b8; }
        .vpc-box { stroke: #475569; }
        .app-node { fill: #0f172a; stroke: #334155; }
        .synthetic-node { fill: #022c22; stroke: #10b981; }
        .structural-node { fill: #172554; stroke: #3b82f6; }
        .label-text { fill: #cbd5e1; }
        .code-text { fill: #fca5a5; }
        .code-text-clean { fill: #34d399; }
        .arrow-line { stroke: #475569; }
        .arrow-head { fill: #475569; }
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
    </marker>
  </defs>

  <!-- Left: Raw Input -->
  <rect x="20" y="20" width="220" height="260" class="app-node" />
  <text x="130" y="45" text-anchor="middle" class="title">Raw Client Prompt</text>
  <text x="35" y="80" class="text">"My SSN is</text>
  <text x="35" y="100" class="code-text">000-00-0000</text>
  <text x="35" y="120" class="text">and my email is</text>
  <text x="35" y="140" class="code-text">john.doe@gmail.com</text>
  <text x="35" y="160" class="text">I am feeling sick."</text>

  <!-- Center-Top: Synthetic Swapping -->
  <rect x="340" y="20" width="540" height="120" class="synthetic-node" />
  <text x="360" y="45" class="title">Mode A: Synthetic Swapping (Default)</text>
  <text x="360" y="65" class="subtitle">Preserves attention weights & eliminates token bloat</text>
  <text x="360" y="95" class="text">"My SSN is</text>
  <text x="440" y="95" class="code-text-clean">999-99-9999</text>
  <text x="525" y="95" class="text">and my email is</text>
  <text x="640" y="95" class="code-text-clean">j.smith@yahoo.com</text>
  <text x="780" y="95" class="text">I am feeling sick."</text>

  <!-- Center-Bottom: Structural Tagging -->
  <rect x="340" y="160" width="540" height="120" class="structural-node" />
  <text x="360" y="185" class="title">Mode B: Structural Tagging</text>
  <text x="360" y="205" class="subtitle">Explicit deterministic boundaries for rigid regex auditing</text>
  <text x="360" y="235" class="text">"My SSN is</text>
  <text x="440" y="235" class="code-text-clean">[SSN_1]</text>
  <text x="500" y="235" class="text">and my email is</text>
  <text x="615" y="235" class="code-text-clean">[EMAIL_1]</text>
  <text x="690" y="235" class="text">I am feeling sick."</text>

  <!-- Arrows -->
  <path d="M 240 100 L 320 100 L 320 80 L 330 80" class="arrow-line" marker-end="url(#arrow)" />
  <path d="M 240 200 L 320 200 L 320 220 L 330 220" class="arrow-line" marker-end="url(#arrow)" />

</svg>
