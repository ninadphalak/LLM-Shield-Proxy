apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-shield-proxy.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "llm-shield-proxy.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "llm-shield-proxy.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "llm-shield-proxy.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
          env:
            - name: AUDIT_LOG_FORMAT
              value: {{ .Values.config.auditLogFormat | quote }}
            - name: FIPS_STRICT_MODE
              value: {{ .Values.config.fipsStrictMode | quote }}
            - name: REDIS_URL
              value: {{ .Values.config.redisUrl | quote }}
            - name: VAULT_ADDR
              value: {{ .Values.config.vaultAddr | quote }}
            - name: ENABLE_MTLS
              value: {{ .Values.mTLS.enabled | quote }}
            - name: SSL_CA_BUNDLE_PATH
              value: {{ .Values.mTLS.caBundlePath | quote }}
            - name: SSL_CLIENT_CERT_PATH
              value: {{ .Values.mTLS.clientCertPath | quote }}
            - name: SSL_CLIENT_KEY_PATH
              value: {{ .Values.mTLS.clientKeyPath | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
