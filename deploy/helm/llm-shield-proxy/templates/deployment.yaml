apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-shield-proxy.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "llm-shield-proxy.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "llm-shield-proxy.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "llm-shield-proxy.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.webhook.enabled }}
          command: ["llm-shield-proxy"]
          args:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - {{ .Values.service.httpPort | quote }}
            - "--tls-cert-file"
            - "/var/run/llm-shield-webhook/tls.crt"
            - "--tls-key-file"
            - "/var/run/llm-shield-webhook/tls.key"
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
          env:
            - name: AUDIT_LOG_FORMAT
              value: {{ .Values.config.auditLogFormat | quote }}
            - name: FIPS_STRICT_MODE
              value: {{ .Values.config.fipsStrictMode | quote }}
            - name: REDIS_URL
              value: {{ .Values.config.redisUrl | quote }}
            - name: VAULT_ADDR
              value: {{ .Values.config.vaultAddr | quote }}
            - name: ENABLE_MTLS
              value: {{ .Values.mTLS.enabled | quote }}
            - name: SSL_CA_BUNDLE_PATH
              value: {{ .Values.mTLS.caBundlePath | quote }}
            - name: SSL_CLIENT_CERT_PATH
              value: {{ .Values.mTLS.clientCertPath | quote }}
            - name: SSL_CLIENT_KEY_PATH
              value: {{ .Values.mTLS.clientKeyPath | quote }}
            - name: K8S_SIDECAR_IMAGE
              value: {{ default (printf "%s:%s" .Values.image.repository .Values.image.tag) .Values.webhook.sidecarImage | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              {{- if .Values.webhook.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
              {{- if .Values.webhook.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- if .Values.webhook.enabled }}
          volumeMounts:
            - name: webhook-tls
              mountPath: /var/run/llm-shield-webhook
              readOnly: true
          {{- end }}
      {{- if .Values.webhook.enabled }}
      volumes:
        - name: webhook-tls
          secret:
            secretName: {{ include "llm-shield-proxy.fullname" . }}-webhook-cert
      {{- end }}
