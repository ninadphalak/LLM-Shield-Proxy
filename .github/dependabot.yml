version: 2
updates:
  # Maintain Python dependencies (FastAPI, Uvicorn, ONNX, etc.)
  - package-ecosystem: "pip"
    directory: "/" 
    schedule:
      interval: "weekly"

  # Maintain Docker base images 
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain GitHub Actions workflows (like CodeQL)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The source recipes pin this repository's own Action as the measuring instrument, and
      # the Action installs the harness from that commit. Moving the pin changes how results
      # are scored while the wall still labels them with the same harness version, so it is
      # bumped by hand, together with a harness version bump, never by Dependabot.
      - dependency-name: "ninadphalak/LLM-Shield-Proxy"
