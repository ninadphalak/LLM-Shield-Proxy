name: Reproducible Public Benchmark

on:
  push:
    branches: [main]
  # Reproduction drift must be caught BEFORE it reaches main, not after. Without this,
  # a change to the emitter that moves a published rate merges green and is only
  # discovered by the push build, when the bad commit is already the thing an
  # independent reproducer clones.
  pull_request:
    branches: [main]
    # A published results-wall row is one line of JSON in a data file, and nothing in this
    # workflow can be affected by it: this reproduces frozen evidence and recomputes
    # published rates. Every submission opens a pull request, so without this the whole
    # reproduction matrix, on four platforms, runs to add a table row.
    #
    # NOT applied to ci.yml, deliberately. That one runs `test_public_docs_style.py`,
    # which is the only automated check on the CONTENT of a submitted row: the em dash and
    # banned-phrase scan over `website/src/data`. Skipping it would remove the guard
    # exactly where stranger-supplied text arrives.
    paths-ignore:
      - 'website/src/data/submitted-rows.json'
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  operator-action:
    name: Operator Action Detects a Gateway Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compare a contained baseline with an email-leaking candidate
        id: regression
        continue-on-error: true
        uses: ./
        with:
          target-base-url: http://127.0.0.1:4000/v1
          start-command: python tests/fixtures/ci_gateway.py --port 4000 --leak-email
          baseline-base-url: http://127.0.0.1:4001/v1
          baseline-start-command: python tests/fixtures/ci_gateway.py --port 4001
          duty: anonymize
      - name: Verify the action failed for the measured regression
        env:
          REPORT_DIRECTORY: ${{ steps.regression.outputs.report-directory }}
          ACTION_OUTCOME: ${{ steps.regression.outcome }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          reports = pathlib.Path(os.environ['REPORT_DIRECTORY'])
          report = json.loads((reports / 'current.json').read_text())
          assert os.environ['ACTION_OUTCOME'] == 'failure'
          assert report['verdict'] == 'LEAK'
          assert 'EMAIL' in report['comparison']['regressions']
          assert report['entities']['SSN'] == 'contained'
          # Both gateways contact the configured upstream before binding their own
          # port, so their discovery request is proof the capture was listening
          # through startup and not only during the measured iterations.
          for label in ('baseline', 'current'):
              raw = json.loads((reports / f'{label}.raw.json').read_text())
              boundary = raw['checks']['configured_upstream_boundary']
              assert '/v1/models' in boundary['upstream_paths_observed'], label
              assert boundary['uninspectable_requests'] == 0, label
          PY

  presidio-reproduction:
    name: Pinned Presidio Integration Reproduction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install './pii-leak-benchmark[validate]'
      - name: Start the pinned detector
        run: |
          docker run -d --name benchmark-presidio -p 127.0.0.1:5002:3000 \
            mcr.microsoft.com/presidio-analyzer@sha256:286e3fa7f3a7426e775e8564fe1870f1ba8f999d3ab8bbb8cc46a44355d9d6e9
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:5002/health; then exit 0; fi
            sleep 2
          done
          docker logs benchmark-presidio
          exit 1
      - run: python benchmarks/reproduce_fragmentation.py --policies presidio-chunk-local,presidio-retention --out reproduction-presidio
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: presidio-reproduction
          path: reproduction-presidio/

  evidence-integrity:
    name: Recompute Published Evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install the evidence verifier
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./pii-leak-benchmark[validate]" pytest pyyaml
          # The four test files below verify published JSON evidence and need nothing
          # from the proxy, but they live under `tests/`, so pytest loads
          # `tests/conftest.py`, which imports the application at module scope. Without
          # the proxy installed that is a collection error, not a test failure:
          # `ModuleNotFoundError: No module named 'orjson'` before a single check runs.
          #
          # Installing the proxy here rather than loosening that import on purpose. A
          # conftest that tolerates a missing application would turn a real import
          # regression into a silent skip in the main CI job, which is the more expensive
          # failure. The harness's own dependency floor is asserted separately by
          # `test_harness_install_weight.py`, in a job with its own environment, so
          # nothing about that guarantee depends on this step.
          python -m pip install -e .

      - name: Verify the frozen artifact manifest against its source commit
        run: |
          git fetch --depth=1 origin 6cbfee39af93909a0d3aba77622ea67af63f84c4
          python benchmarks/verify_frozen_evidence.py

      - name: Verify schemas, provenance, pairing, and bounded oracles
        run: |
          python -m pytest -q \
            tests/conformance/test_published_profiles.py \
            tests/conformance/test_results_are_comparable.py \
            tests/conformance/test_fide_partition_oracle.py \
            tests/conformance/test_spec_v2_schema.py

      - name: Recompute uncertainty and every published table candidate
        run: |
          python benchmarks/fide_uncertainty.py \
            --results benchmarks/results/v2-response-split \
            --out FIDE_UNCERTAINTY.json > /dev/null
          python benchmarks/fide_numeric_audit.py \
            --v2 benchmarks/results/v2-response-split \
            --fide benchmarks/results/fide-v2.1 \
            --uncertainty FIDE_UNCERTAINTY.json \
            --out FIDE_NUMERIC_AUDIT.md

      - name: Upload recomputed analysis
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: published-evidence-analysis
          path: |
            FIDE_UNCERTAINTY.json
            FIDE_NUMERIC_AUDIT.md
          retention-days: 90

  results-page:
    # The published results table is generated from the committed reports. This job is the
    # thing that keeps it honest: it regenerates the page and fails if the committed page
    # and the committed reports disagree, so a number on the site cannot outlive the
    # artefact it came from.
    #
    # It is a staleness GATE rather than an auto-commit. A job that pushed to main would
    # need write permissions it does not otherwise need, would be refused by branch
    # protection, and cannot work at all from a fork. The gate gives the same guarantee
    # -- page and reports can never disagree on main -- with none of that. The regenerated
    # page is uploaded either way, so a fork run produces its own copy.
    name: Results Page Matches The Reports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Fail if the committed page drifted from the committed reports
        # MUST run before anything regenerates the file. This job previously regenerated
        # first and checked second, which made the gate unfalsifiable: the first step
        # repaired a stale page in the runner's workspace, so `--check` compared the
        # freshly written file against itself and could never fail. A gate that cannot
        # fail is worse than no gate, because the green tick is read as evidence.
        # Generates from JSON with the standard library only; nothing to install.
        run: python benchmarks/generate_results_page.py --check

      - name: Regenerate the page for the artifact
        # After the gate, and on failure too, so a red run hands you the page it wanted.
        if: always()
        run: python benchmarks/generate_results_page.py

      - name: Upload the regenerated page
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: generated-results-page
          path: website/docs/conformance/results.md
          retention-days: 90

  fragmentation-reproduction:
    # Calibrates study-owned reference policies on a clean runner and diffs the
    # regenerated reports against the published JSON, field by field. The
    # `evidence-integrity` job above recomputes statistics FROM the published files and so
    # cannot see the experiment itself drifting; this job runs the experiment.
    #
    # The matrix is the claim. A single-runner green says the numbers reproduce on one
    # machine; three operating systems and two interpreters say the measurement does not
    # depend on the host, which is what an independent reproducer needs to know before
    # treating a mismatch on their machine as a finding.
    name: Reproduce Fragmentation Result (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"

      - name: Install the neutral harness only
        # Deliberately not the proxy. The experiment measures reference inspector
        # policies implemented inside the harness; if it needed the product installed to
        # reproduce, the result would not be endpoint-neutral.
        #
        # What this install actually supplies is the dependency (`httpx`). The driver
        # puts `pii-leak-benchmark/` on PYTHONPATH ahead of site-packages, so the code
        # under measurement is the CHECKED-OUT revision and not whatever version pip
        # happened to resolve. That ordering is the point: an installed copy shadowing
        # the worktree would silently measure a different commit than the one the job
        # reports.
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./pii-leak-benchmark

      - name: Re-run chunk-local and bounded-retention, then diff against published
        run: python benchmarks/reproduce_fragmentation.py --out reproduction

      - name: Upload the regenerated reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fragmentation-reproduction-${{ matrix.os }}-py${{ matrix.python }}
          path: reproduction/
          retention-days: 90

  benchmark:
    name: Run Streaming Privacy Conformance
    runs-on: ubuntu-latest
    env:
      TELEMETRY_ENABLED: "false"
      TELEMETRY_ENDPOINT_URL: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # `pip install .` requires the neutral harness distribution, which lives in
          # this repo and is released separately. Install it from source so this
          # workflow does not depend on PyPI having caught up with the commit.
          pip install ./pii-leak-benchmark
          pip install -r requirements.txt
          pip install -e .

      - name: Run conformance harness
        run: |
          llm-shield-proxy benchmark --iterations 2000 --json-out CONFORMANCE_LATEST.json

      - name: Append results to job summary
        shell: bash
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json

          with open("CONFORMANCE_LATEST.json", encoding="utf-8") as source:
              conformance = json.load(source)

          empty = conformance["microbenchmarks"]["empty_vault_buffer"]
          protected = conformance["microbenchmarks"]["protected_token_buffer"]
          memory = conformance["memory"]

          print("# LLM-Shield-Proxy Conformance Results")
          print()
          print(
              f"_Generated: {conformance['generated_at']} on Python "
              f"{conformance['environment']['python']} "
              f"({conformance['environment']['platform']})_"
          )
          print()
          print("## Streaming privacy conformance")
          print()
          print(f"- Passed: **{conformance['passed']}**")
          print(f"- Checks: **{len(conformance['checks'])}**")
          print(f"- Iterations: **{conformance['microbenchmarks']['iterations']}**")
          print(f"- Scope: {conformance['microbenchmarks']['scope']}")
          print()
          print("## In-process component observations")
          print()
          print("| Operation | p50 | p95 | p99 |")
          print("| :--- | ---: | ---: | ---: |")
          print(
              f"| Empty-vault buffer | {empty['p50'] / 1000:.1f} us | "
              f"{empty['p95'] / 1000:.1f} us | {empty['p99'] / 1000:.1f} us |"
          )
          print(
              f"| Protected-token buffer | {protected['p50'] / 1000:.1f} us | "
              f"{protected['p95'] / 1000:.1f} us | {protected['p99'] / 1000:.1f} us |"
          )
          print()
          print("## Declared allocation scope")
          print()
          print(f"- Peak Python-traced bytes: **{memory['peak_bytes']}**")
          print(
              f"- Retained characters: **{memory['retained_characters']} / "
              f"{memory['retention_bound_characters']}**"
          )
          print(f"- Scope: {memory['scope']}")
          EOF

      - name: Upload machine-readable conformance artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: conformance-latest
          path: CONFORMANCE_LATEST.json
          retention-days: 90
