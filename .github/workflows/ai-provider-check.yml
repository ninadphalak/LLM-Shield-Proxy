name: AI provider check

# Ask each configured provider which models THIS repository's key may actually call.
#
# WHY THIS EXISTS. `pr_agent.yml` names a primary and a fallback model. A wrong id there is
# not a loud failure: the primary is usually fine, so a bad FALLBACK id only ever runs once
# the primary has already failed, and it stays silent until the exact moment it is needed.
# That is not hypothetical here -- a configured fallback answered
#
#   404  models/<id> is not found for API version v1alpha
#
# through three runs, because the id had been taken from the review tool's own MAX_TOKENS
# table. That table lists models the tool knows how to SIZE, not models a key may CALL. The
# two are different sets, and only the provider can settle it.
#
# Run this before changing a model id, and take the value from the output.
#
# Endpoints, auth header shapes and credentials all come from repository variables and
# secrets, so this public file names no provider. It prints each response verbatim rather
# than parsing per-provider JSON shapes: one less thing to keep in step with an API, and an
# error body then reaches you intact instead of being swallowed as "no models found".
#
# Manual only. There is nothing to run on a push, and a scheduled job that touches provider
# credentials for no reason is a standing risk with no payoff.

on:
  workflow_dispatch:

permissions: {}

jobs:
  list-models:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: List callable models
        env:
          # Read into the environment rather than interpolated into the command line:
          # `${{ secrets.X }}` inline would place the credential in the process's argv,
          # which is readable by any other process on the runner. Actions masks secret
          # values in log output; argv is not log output.
          # Descriptive secret names are deliberate; see pr_agent.yml.
          A_KEY: ${{ secrets.DEEPSEEK_API_KEY_PR }}
          A_URL: ${{ vars.PR_PROVIDER_A_MODELS_URL }}
          A_HDR: ${{ vars.PR_PROVIDER_A_AUTH_HEADER }}
          A_PRE: ${{ vars.PR_PROVIDER_A_AUTH_PREFIX }}
          B_KEY: ${{ secrets.GEMINI_API_KEY_PR }}
          B_URL: ${{ vars.PR_PROVIDER_B_MODELS_URL }}
          B_HDR: ${{ vars.PR_PROVIDER_B_AUTH_HEADER }}
          B_PRE: ${{ vars.PR_PROVIDER_B_AUTH_PREFIX }}
        run: |
          set -euo pipefail
          # No `set -x` anywhere in this file: it would echo the expanded curl command,
          # credential included, straight into the log.

          ask() {
            label="$1"; url="$2"; hdr="$3"; pre="$4"; key="$5"
            echo ""
            echo "=============== provider ${label} ==============="
            if [ -z "${url}" ] || [ -z "${key}" ] || [ -z "${hdr}" ]; then
              echo "not configured; skipping."
              return 0
            fi
            # The header goes in on STDIN, not as `-H "..."`. An argument is visible in
            # curl's argv, which every other process on the runner can read -- which is
            # exactly what the comment above this step says we are avoiding, and passing
            # `-H` would have made that comment false. `echo` is a shell builtin, so it
            # does not put the credential in an argv of its own either.
            #
            # `-sS` stays quiet but still reports transport errors. Deliberately no `-f`:
            # an HTTP error BODY says what is actually wrong, and -f discards it.
            echo "${hdr}: ${pre}${key}" | curl -sS "${url}" --header @- || true
            echo ""
          }

          # An absent auth prefix is normal: one scheme wants "Bearer ", another wants the
          # bare key in its own header. An absent URL or key just skips that provider.
          ask A "${A_URL:-}" "${A_HDR:-}" "${A_PRE:-}" "${A_KEY:-}"
          ask B "${B_URL:-}" "${B_HDR:-}" "${B_PRE:-}" "${B_KEY:-}"

          echo ""
          echo "Take an id that can SERVE A REVIEW into PR_REVIEW_MODEL or"
          echo "PR_REVIEW_FALLBACKS via 'gh variable set', with its provider prefix."
          echo ""
          echo "Not every id in these responses can. The lists also carry embedding,"
          echo "token-counting, speech and image models, and one of those configured as a"
          echo "fallback fails exactly the way a wrong id does: only once the primary has"
          echo "failed, silently, at the moment it is needed. Where a response marks"
          echo "capability -- a generation-methods or modality field -- check it."
