name: PR Agent

# AI review on every pull request, and on `/review`-style comments.
#
# The model ids are repository VARIABLES, not literals in this file, because this
# repository is public and the choice of provider is not something it publishes. Set them
# with `gh variable set PR_REVIEW_MODEL` / `PR_REVIEW_FALLBACKS`, and read the current
# values with `gh variable list`.
#
# WHY THE ENV BLOCK LOOKS LIKE THIS. PR-Agent maps env names onto its own
# `configuration.toml` keys, so a misspelled key is not an error -- it is silently ignored
# and the run falls back to a default provider with no credential, then fails with an
# authentication error that names that provider rather than the mistake. Every name below
# is the exact key from `pr_agent/settings/configuration.toml`. A model id also needs its
# provider prefix or litellm cannot route it, and FALLBACK_MODELS is plural and a list.
#
# GITHUB_TOKEN is required: without it PR-Agent cannot read the PR or post its review.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

# One review per PR at a time, for PUSHES only.
#
# Each run sends the whole diff to the model, so pushing three commits in a minute
# without this starts three runs that each pay for the whole diff -- and the first two
# describe code the third has already replaced. Grouping them means run 3 cancels runs
# 1 and 2, and you pay once, for the state that actually exists.
#
# The comment id is in the key on purpose. A `/review` or `/improve` comment is an
# explicit request from a person, and if comment runs shared the push group, typing
# `/improve` during an auto-review would kill one of the two: either the review the push
# asked for, or the command the human asked for, silently and with no output either way.
# Every comment gets its own group, so nothing cancels a typed command.
concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event.comment.id || 'push' }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr_agent_job:
    # Both halves are load-bearing. Without the sender check, PR-Agent's own review
    # comment is an `issue_comment` that triggers another run -- a paid loop. Without the
    # pull_request check, every comment on every plain ISSUE in this repo starts a review
    # of nothing.
    if: >-
      github.event.sender.type != 'Bot' &&
      (github.event_name == 'pull_request' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    # Least privilege, and deliberately narrower than upstream's example, which asks for
    # `contents: write` and `checks: write`. Review, describe and improve only read the
    # diff and write comments and the PR body. A command that edits code (`/add_docs`)
    # will fail loudly here rather than this workflow holding write access to the tree on
    # every comment in the repo. Widen it when a command that needs it is actually wanted.
    permissions:
      issues: write
      pull-requests: write
      contents: read
    # The action is a Docker image pulling a model over the network. Without a cap, a hung
    # call sits on a runner for six hours.
    timeout-minutes: 20
    name: Review the pull request
    steps:
      # The review tool locates a credential by reading an env var whose NAME it chooses,
      # e.g. `<PROVIDER>.KEY`. That name is the left-hand side of the mapping, and GitHub
      # Actions does not allow an expression there -- `${{ vars.X }}: value` is not a valid
      # env key -- so moving the model IDS to variables did nothing for these. Exporting
      # the pair at runtime does: the name comes from a variable too, and this file names
      # no provider.
      #
      # The credential ends up in the job environment either way; what changes is that the
      # public file no longer says whose it is. Actions masks secret values in logs in both
      # designs.
      - name: Configure review credentials
        env:
          PROVIDER_A_KEY: ${{ secrets.DEEPSEEK_API_KEY_PR }}
          PROVIDER_B_KEY: ${{ secrets.GEMINI_API_KEY_PR }}
          PROVIDER_A_KEY_ENV: ${{ vars.PR_PROVIDER_A_KEY_ENV }}
          PROVIDER_B_KEY_ENV: ${{ vars.PR_PROVIDER_B_KEY_ENV }}
        run: |
          set -euo pipefail
          # No `set -x` here, ever: it would echo the expanded credential.
          # An unset credential is not an error -- the chain skips that provider, which is
          # what lets a partly configured repository still get a review.
          if [ -n "${PROVIDER_A_KEY_ENV:-}" ] && [ -n "${PROVIDER_A_KEY:-}" ]; then
            echo "${PROVIDER_A_KEY_ENV}=${PROVIDER_A_KEY}" >> "$GITHUB_ENV"
          fi
          if [ -n "${PROVIDER_B_KEY_ENV:-}" ] && [ -n "${PROVIDER_B_KEY:-}" ]; then
            echo "${PROVIDER_B_KEY_ENV}=${PROVIDER_B_KEY}" >> "$GITHUB_ENV"
          fi

      - name: PR Agent action step
        id: pragent
        # Pinned to a commit SHA with the tag in a comment, matching every other action in
        # this repository. `Codium-ai/pr-agent@main` was both a stale owner name and an
        # unpinned ref: a moving `main` on a third-party action that receives a repository
        # token and an API key is an unreviewed dependency on every run.
        uses: the-pr-agent/pr-agent@f3b385ea2927247ddcff2fe252472380b9c8f5fc # v0.45.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG.MODEL: ${{ vars.PR_REVIEW_MODEL }}
          # Ordered, and the order is the argument. Earlier entries should be cheap and
          # same-provider (they cover one model being overloaded); the LAST entry should
          # be a different provider, because that is the only thing that survives an
          # account-level quota or a provider outage, both of which take the primary and
          # its same-provider siblings down together.
          #
          # Verify any id with `ai-provider-check.yml` before putting it here. A wrong
          # FALLBACK id is the dangerous one: it only ever runs once the primary has
          # already failed, so it stays silent until the moment it is needed. One sat
          # here returning 404 for three runs and nobody noticed.
          CONFIG.FALLBACK_MODELS: ${{ vars.PR_REVIEW_FALLBACKS }}
          # PR-Agent caps every model at 32000 tokens by default, whatever the model can
          # actually take. A 25059-token diff fit `/review` and not `/improve`, which
          # wraps more scaffolding around the same diff, and the failure was reported
          # with no reason given. This is a CLAMP -- min(model limit, this) -- so it
          # stays a real ceiling on spend and cannot overflow a smaller model added
          # later. Measured: a run logged "total tokens under limit: 200000", so the
          # configured models resolve to at least that.
          CONFIG.MAX_MODEL_TOKENS: "200000"
          # MUST match the `pull_request` types above. PR-Agent's own default is
          # ['opened', 'reopened', 'ready_for_review', 'review_requested'] -- WITHOUT
          # `synchronize` -- so a workflow that triggers on a push to an open PR builds
          # the Docker image, starts the agent, logs "Skipping action: synchronize" and
          # exits green having reviewed nothing. A listened-for event that is then
          # discarded is worse than not listening: it bills a runner and reports success.
          GITHUB_ACTION_CONFIG.PR_ACTIONS: '["opened", "reopened", "ready_for_review", "synchronize"]'
          # Review and suggestions, yes. `auto_describe` rewrites the PR body, and the
          # bodies in this repository carry the measurements and the reasoning behind a
          # change; a generated summary would overwrite the evidence.
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "true"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "false"
          # Where the standing project context comes from. PR-Agent reads these from the
          # DEFAULT BRANCH, so it can only ever see committed files -- `.llm/CONTEXT.md`
          # is gitignored and unreachable from CI by design.
          #
          # NOT `AGENTS.md`, which is PR-Agent's default and the wrong file here: this
          # repository already uses root-level agent pointer files, which are gitignored
          # and local. A separate, deliberately public file keeps those private and makes
          # the published brief an explicit choice. It carries positive invariants only --
          # no known-gap list -- because this repo is public and publishing an unfixed
          # weakness in a security product is a disclosure decision.
          CONFIG.REPO_CONTEXT_FILES: '[".github/REVIEW-CONTEXT.md"]'
          # This project's review value is in correctness and security, not style.
          PR_REVIEWER.EXTRA_INSTRUCTIONS: >-
            This is a streaming privacy gateway and a measurement harness for regulated
            environments. Weight findings in this order: (1) anything that could let
            personal data, secrets or PII reach a log, a trace, an upstream provider or a
            published artifact; (2) fail-open behaviour in a security or policy gate,
            which must deny on error, timeout or missing config; (3) unbounded memory or
            blocking calls on the async streaming hot path; (4) a published measurement or
            claim that the code does not actually establish. Ignore formatting and naming
            preferences; ruff, bandit and pyright already gate those.
