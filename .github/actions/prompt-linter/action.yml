name: "LLM-Shield Prompt Template Linter"
description: "Scans .txt/.md prompt template files for PII and high-entropy secrets using the Tier-1 regex and Tier-2 Shannon-entropy heuristics from LLM-Shield-Proxy."
author: "Ninad Phalak"
branding:
  icon: "shield"
  color: "blue"

inputs:
  path:
    description: "Root path to scan for .txt/.md files"
    required: false
    default: "."
  entropy-threshold:
    description: "Shannon entropy threshold (bits/symbol) for Tier-2 secret detection"
    required: false
    default: "4.5"
  min-token-length:
    description: "Minimum token length considered for Tier-2 entropy analysis"
    required: false
    default: "16"
  fail-on-finding:
    description: "If 'true', fail the workflow when any Tier-1/Tier-2 finding is detected"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.12"

    - name: Run Tier-1/Tier-2 Prompt Template Scan
      shell: bash
      # Inputs arrive through the environment, never spliced into the script: a value
      # holding a quote or `$(...)` would otherwise run as shell.
      env:
        LINTER_ACTION_PATH: ${{ github.action_path }}
        LINTER_PATH: ${{ inputs.path }}
        LINTER_ENTROPY_THRESHOLD: ${{ inputs.entropy-threshold }}
        LINTER_MIN_TOKEN_LENGTH: ${{ inputs.min-token-length }}
        LINTER_FAIL_ON_FINDING: ${{ inputs.fail-on-finding }}
      run: |
        python "$LINTER_ACTION_PATH/scanner.py" \
          --path "$LINTER_PATH" \
          --entropy-threshold "$LINTER_ENTROPY_THRESHOLD" \
          --min-token-length "$LINTER_MIN_TOKEN_LENGTH" \
          --fail-on-finding "$LINTER_FAIL_ON_FINDING"
