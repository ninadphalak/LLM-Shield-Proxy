name: "PII leak benchmark"
description: >-
  Measure whether an OpenAI-compatible streaming gateway sends raw personal data to its
  configured upstream, and whether it restores the values in the response. Produces a
  schema-valid report as a build artifact and a summary in the job log.
author: "Ninad Phalak"

# Why this exists: a run that appears in YOUR repository's CI log, under YOUR account, is
# stronger evidence than a file sent to a maintainer. The log is public, the commit is
# yours, and nothing about it requires trusting this project.
#
# The report's `attestation` block records GITHUB_SHA, the repository and the run URL. It
# is `self-reported` and the schema pins it to that value: it records who SAYS they ran
# the harness. A public CI log is evidence a reader checks, not a claim the harness makes.
# Set `attest-report: true` to add a DETACHED GitHub/Sigstore attestation over the
# finished report bytes. The caller must grant `id-token: write` and
# `attestations: write`; a composite action cannot grant permissions to itself.

branding:
  icon: "shield"
  color: "purple"

inputs:
  target-base-url:
    description: "OpenAI-compatible /v1 base URL of the gateway under test. Use capture://self for the raw pass-through control."
    required: true
  target-name:
    description: "Name of the gateway under test, as it should appear in a published row."
    required: false
    default: "external-openai-compatible-endpoint"
  target-version:
    description: "Exact version or image digest measured. A row without this is unpublishable."
    required: false
    default: "unspecified"
  target-api-key:
    description: "Credential the target expects. Pass a secret; it is never written to the report."
    required: false
    default: "conformance-key"
  target-model:
    description: "Model name sent to the target."
    required: false
    default: "conformance-model"
  target-header:
    description: "Extra request headers for the target, one NAME=VALUE per line. Values are passed through the environment and never written to the report."
    required: false
    default: ""
  iterations:
    description: "Measured iterations. Every iteration issues live requests to the target."
    required: false
    default: "3"
  capture-host:
    description: "Bind host for the controlled capture upstream."
    required: false
    default: "127.0.0.1"
  capture-port:
    description: "Bind port for the controlled capture upstream. Your gateway must already be configured to send upstream traffic here."
    required: false
    default: "8765"
  capture-public-url:
    description: "Externally reachable /v1 URL the target was configured with. Required when capture-host is not loopback."
    required: false
    default: ""
  capture-token:
    description: "Bearer token the capture requires. Required in public mode. Pass a secret; it is never written to the report."
    required: false
    default: ""
  redaction-claimed:
    description: "What the vendor CLAIMS about PII redaction: claimed, not-offered, or unknown. 'unknown' produces a non-publishable run."
    required: false
    default: "unknown"
  redaction-claim-citation:
    description: "URL where the vendor states the claim. Required unless redaction-claimed is unknown."
    required: false
    default: ""
  redaction-claim-quote:
    description: "Optional short quote from the cited source."
    required: false
    default: ""
  redaction-enabled:
    description: "true if the target's redaction feature was enabled for this run."
    required: false
    default: "false"
  redaction-config-reference:
    description: "The exact setting/guardrail/config that enabled redaction. Required when redaction-enabled is true."
    required: false
    default: ""
  python-version:
    description: "Python used to run the harness."
    required: false
    default: "3.12"
  source:
    description: >-
      Where to install the harness from. Default installs `pii-leak-benchmark` from PyPI.
      Set a path (e.g. ./pii-leak-benchmark) to run a working tree instead.
    required: false
    default: "pii-leak-benchmark"
  json-out:
    description: "Path for the raw report."
    required: false
    default: "pii-leak-benchmark-report.json"
  artifact-name:
    description: "Name of the uploaded build artifact. Set to an empty string to skip the upload."
    required: false
    default: "pii-leak-benchmark-report"
  fail-on-non-pass:
    description: >-
      Fail the step when the run did not pass all checks. Leave true for a gateway you
      expect to pass; set false when a non-pass is the expected result (a negative
      control, or a product that does not claim redaction).
    required: false
    default: "true"
  attest-report:
    description: >-
      Create detached GitHub/Sigstore provenance over the raw report. The caller must
      grant id-token: write and attestations: write. Required for a submitted run to
      count toward the independent-replication floor.
    required: false
    default: "false"
  profiles:
    description: >-
      Which profile to run against the target: operator (the request-path check, the
      default), response (the response-split profile: FidelityRate, LeakRate with the value
      whole and split across two chunks, and DeltaFrag), or both. The response profile needs
      a harness that ships the pii-leak-benchmark-v2 command; with capture://self it runs
      its own pass-through policy, the raw control.
    required: false
    default: "operator"
  response-seed:
    description: "Hex seed for the response profile. The default is the published seed."
    required: false
    default: "a1b2c3d4e5f60001"
  response-capture-port:
    description: >-
      Bind port for the response profile's own capture. Your gateway must send upstream
      traffic here while that profile runs. 0 picks a free port, which only works for
      capture://self.
    required: false
    default: "8799"
  response-out:
    description: "Directory for the response report and its summary rows; uploaded with the raw report."
    required: false
    default: "pii-leak-benchmark-response"

outputs:
  outcome:
    description: "What a published row may say: pass, fail, no-leak-profile-not-met, not-applicable, redaction-not-enabled, inconclusive, or claim-unstated."
    value: ${{ steps.run.outputs.outcome }}
  passed:
    description: "The raw measurement: did every check pass."
    value: ${{ steps.run.outputs.passed }}
  leaked-entity-types:
    description: "Comma-separated entity types that reached the capture. Empty on a clean run."
    value: ${{ steps.run.outputs.leaked }}
  report-path:
    description: "Path to the raw report."
    value: ${{ steps.run.outputs.report }}
  attestation-url:
    description: "Verification page for the detached report attestation; empty when attest-report is false."
    value: ${{ steps.attest.outputs.attestation-url }}
  response-report-path:
    description: "Path to the response-split report; empty when profile is operator."
    value: ${{ steps.response.outputs.report }}
  response-leaked:
    description: "true when the response profile saw a value reach the client, whole or split; empty when profile is operator."
    value: ${{ steps.response.outputs.leaked }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install the harness
      shell: bash
      env:
        HARNESS_SOURCE: ${{ inputs.source }}
        INPUT_PROFILE: ${{ inputs.profiles }}
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        # Standard library plus httpx. Installing this never installs a gateway.
        python -m pip install "$HARNESS_SOURCE"
        if [ "$INPUT_PROFILE" != "operator" ]; then
          # The response profile validates its report against the bundled v2 schema.
          python -m pip install "jsonschema>=4.0"
        fi
        python -m pip list --format=freeze

    - name: Run the profile
      id: run
      if: ${{ inputs.profiles != 'response' }}
      shell: bash
      env:
        CONFORMANCE_CAPTURE_TOKEN: ${{ inputs.capture-token }}
        CONFORMANCE_TARGET_API_KEY: ${{ inputs.target-api-key }}
        CONFORMANCE_TARGET_HEADERS: ${{ inputs.target-header }}
        INPUT_CAPTURE_HOST: ${{ inputs.capture-host }}
        INPUT_CAPTURE_PORT: ${{ inputs.capture-port }}
        INPUT_CAPTURE_PUBLIC_URL: ${{ inputs.capture-public-url }}
        INPUT_ITERATIONS: ${{ inputs.iterations }}
        INPUT_JSON_OUT: ${{ inputs.json-out }}
        INPUT_REDACTION_CLAIM_CITATION: ${{ inputs.redaction-claim-citation }}
        INPUT_REDACTION_CLAIM_QUOTE: ${{ inputs.redaction-claim-quote }}
        INPUT_REDACTION_CLAIMED: ${{ inputs.redaction-claimed }}
        INPUT_REDACTION_CONFIG_REFERENCE: ${{ inputs.redaction-config-reference }}
        INPUT_REDACTION_ENABLED: ${{ inputs.redaction-enabled }}
        INPUT_TARGET_BASE_URL: ${{ inputs.target-base-url }}
        INPUT_TARGET_MODEL: ${{ inputs.target-model }}
        INPUT_TARGET_NAME: ${{ inputs.target-name }}
        INPUT_TARGET_VERSION: ${{ inputs.target-version }}
      run: |
        set -euo pipefail
        args=(
          --target-base-url "$INPUT_TARGET_BASE_URL"
          --target-name "$INPUT_TARGET_NAME"
          --target-version "$INPUT_TARGET_VERSION"
          --target-model "$INPUT_TARGET_MODEL"
          --iterations "$INPUT_ITERATIONS"
          --capture-host "$INPUT_CAPTURE_HOST"
          --capture-port "$INPUT_CAPTURE_PORT"
          --redaction-claimed "$INPUT_REDACTION_CLAIMED"
          --json-out "$INPUT_JSON_OUT"
        )
        # `if`, not `[ ... ] && ...`: the runner runs this with `set -e`, and a false
        # test as the last command of a line exits the whole step.
        if [ -n "$INPUT_CAPTURE_PUBLIC_URL" ]; then
          args+=(--capture-public-url "$INPUT_CAPTURE_PUBLIC_URL")
        fi
        if [ -n "$INPUT_REDACTION_CLAIM_CITATION" ]; then
          args+=(--redaction-claim-citation "$INPUT_REDACTION_CLAIM_CITATION")
        fi
        if [ -n "$INPUT_REDACTION_CLAIM_QUOTE" ]; then
          args+=(--redaction-claim-quote "$INPUT_REDACTION_CLAIM_QUOTE")
        fi
        if [ -n "$INPUT_REDACTION_CONFIG_REFERENCE" ]; then
          args+=(--redaction-config-reference "$INPUT_REDACTION_CONFIG_REFERENCE")
        fi
        if [ "$INPUT_REDACTION_ENABLED" = "true" ]; then
          args+=(--redaction-enabled)
        fi
        # Credentials and additional headers go through the environment, never argv:
        # process listings are readable by every other process on the runner.
        set +e
        pii-leak-benchmark "${args[@]}"
        status=$?
        set -e
        # Exit 2 means the run itself could not be trusted (capture unreachable, or
        # something else was listening on its port). That is never a result.
        if [ "$status" -ge 2 ]; then
          echo "::error::The harness could not complete a trustworthy run (exit $status)."
          exit "$status"
        fi

        python - "$INPUT_JSON_OUT" <<'PY' >> "$GITHUB_OUTPUT"
        import json, sys, uuid

        report = json.load(open(sys.argv[1], encoding="utf-8"))
        boundary = report["checks"]["configured_upstream_boundary"]

        def output(name, value):
            delimiter = "ghadelimiter_" + uuid.uuid4().hex
            print(f"{name}<<{delimiter}")
            print(value)
            print(delimiter)

        output("outcome", report["outcome"])
        output("passed", str(report["passed"]).lower())
        output("leaked", ",".join(boundary["leaked_entity_types"]))
        output("report", sys.argv[1])
        PY

    - name: Summarise
      if: ${{ inputs.profiles != 'response' }}
      shell: bash
      env:
        INPUT_JSON_OUT: ${{ inputs.json-out }}
      run: |
        set -euo pipefail
        python - "$INPUT_JSON_OUT" <<'PY' >> "$GITHUB_STEP_SUMMARY"
        import json, sys
        report = json.load(open(sys.argv[1], encoding="utf-8"))
        boundary = report["checks"]["configured_upstream_boundary"]
        print("# PII leak benchmark")
        print()
        print(f"**{report['implementation']['name']} {report['implementation']['version']}** - "
              f"outcome `{report['outcome']}`")
        print()
        print("> " + report["outcome_rationale"])
        print()
        print("| Check | Result |")
        print("| :--- | :--- |")
        for name, check in sorted(report["checks"].items()):
            print(f"| `{name}` | {'pass' if check['passed'] else 'FAIL'} |")
        print()
        print(f"- Leaked entity types: `{boundary['leaked_entity_types'] or '[]'}`")
        print(f"- Captured / correlated requests: {boundary['captured_requests']} / "
              f"{boundary['correlated_requests']}")
        print(f"- Capture mode: `{report['capture']['mode']}`")
        print(f"- Harness revision: `{report['harness_revision']}`")
        print()
        print("A measurement is not a verdict: `fail` means protected data reached the "
              "capture origin, and nothing else does. Before publishing this as a row, read "
              "https://github.com/ninadphalak/LLM-Shield-Proxy/blob/main/website/docs/conformance/submitting.md")
        PY

    - name: Run the response profile
      id: response
      if: ${{ inputs.profiles == 'response' || inputs.profiles == 'both' }}
      shell: bash
      env:
        INPUT_TARGET_BASE_URL: ${{ inputs.target-base-url }}
        INPUT_TARGET_NAME: ${{ inputs.target-name }}
        INPUT_TARGET_MODEL: ${{ inputs.target-model }}
        INPUT_TARGET_HEADERS: ${{ inputs.target-header }}
        INPUT_REDACTION_ENABLED: ${{ inputs.redaction-enabled }}
        INPUT_RESPONSE_SEED: ${{ inputs.response-seed }}
        INPUT_RESPONSE_CAPTURE_PORT: ${{ inputs.response-capture-port }}
        INPUT_RESPONSE_OUT: ${{ inputs.response-out }}
        V2_GATEWAY_TOKEN: ${{ inputs.target-api-key }}
      run: |
        set -euo pipefail
        if ! command -v pii-leak-benchmark-v2 > /dev/null; then
          echo "::error::The installed pii-leak-benchmark has no pii-leak-benchmark-v2 command. The response profile needs a release later than 0.4.1, or source: ./pii-leak-benchmark from a checkout that has it."
          exit 2
        fi
        mkdir -p "$INPUT_RESPONSE_OUT"
        args=(
          --validate --oracle midpoint
          --seed "$INPUT_RESPONSE_SEED"
          --upstream-port "$INPUT_RESPONSE_CAPTURE_PORT"
          --model "$INPUT_TARGET_MODEL"
          --out "$INPUT_RESPONSE_OUT"
          --json-out "$INPUT_RESPONSE_OUT/response-summary.json"
        )
        if [ "$INPUT_TARGET_BASE_URL" = "capture://self" ]; then
          # No gateway in the loop: the profile's own pass-through policy is the raw control.
          policy=passthrough
        else
          # The report is named after the target, so the filename must be one.
          policy="$(printf '%s' "$INPUT_TARGET_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          args+=(--gateway-url "${INPUT_TARGET_BASE_URL%/}/chat/completions")
        fi
        args+=(--only "$policy")
        # Headers reach the instrument through the environment, never argv.
        if [ -n "$INPUT_TARGET_HEADERS" ]; then
          V2_GATEWAY_HEADERS="$(python - <<'PY'
        import json, os
        headers = {}
        for line in os.environ["INPUT_TARGET_HEADERS"].splitlines():
            if "=" in line:
                name, value = line.split("=", 1)
                headers[name.strip()] = value.strip()
        print(json.dumps(headers))
        PY
        )"
          export V2_GATEWAY_HEADERS
        fi
        # The report records whether the request path was asked to redact. Only the caller
        # knows; redaction-enabled says so, and an explicit V2_REQUEST_PATH_REDACTION wins.
        if [ -z "${V2_REQUEST_PATH_REDACTION:-}" ] && [ "$INPUT_REDACTION_ENABLED" = "true" ]; then
          export V2_REQUEST_PATH_REDACTION=configured
        fi
        set +e
        pii-leak-benchmark-v2 "${args[@]}"
        status=$?
        set -e
        if [ "$status" -ne 0 ]; then
          echo "::error::The response profile did not produce a schema-valid report (exit $status)."
          exit "$status"
        fi
        python - "$INPUT_RESPONSE_OUT/response-summary.json" "$INPUT_RESPONSE_OUT/$policy.json" <<'PY' >> "$GITHUB_OUTPUT"
        import json, sys
        rows = json.load(open(sys.argv[1], encoding="utf-8"))["rows"]
        leaked = any(row["leak_single_chunk"] > 0 or row["leak_adversarial"] > 0 for row in rows)
        print(f"report={sys.argv[2]}")
        print(f"leaked={str(leaked).lower()}")
        PY

    - name: Summarise the response profile
      if: ${{ inputs.profiles == 'response' || inputs.profiles == 'both' }}
      shell: bash
      env:
        INPUT_RESPONSE_OUT: ${{ inputs.response-out }}
      run: |
        set -euo pipefail
        python - "$INPUT_RESPONSE_OUT/response-summary.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
        import json, sys
        summary = json.load(open(sys.argv[1], encoding="utf-8"))
        print("# Response-split profile")
        print()
        print("| Policy | Fidelity | Leak, value whole | Leak, value split | DeltaFrag | Applicable | Inconclusive | Schema |")
        print("| :--- | ---: | ---: | ---: | ---: | ---: | ---: | :--- |")
        for row in summary["rows"]:
            schema = "valid" if row["schema_valid"] else "INVALID" if row["schema_valid"] is False else "not checked"
            print(f"| `{row['policy']}` | {row['fidelity_rate']:.4f} | {row['leak_single_chunk']:.4f} | "
                  f"{row['leak_adversarial']:.4f} | {row['delta_frag']:.4f} | {row['cases_applicable']} | "
                  f"{row['inconclusive']} | {schema} |")
        print()
        print(f"- Seed: `{summary['rows'][0]['seed'] if summary['rows'] else ''}`; oracle: `{summary['oracle']}`")
        print(f"- Instrument: `{summary['instrument'].get('inspector_sha256', '')[:16]}`")
        print()
        print("DeltaFrag is the split-chunk leak rate minus the whole-value leak rate: what "
              "splitting a value across two chunks costs the gateway. A rate is a fraction of "
              "the applicable cases; inconclusive cases are excluded from the denominator.")
        PY

    - name: Attest the raw report
      id: attest
      if: ${{ inputs.attest-report == 'true' }}
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-path: ${{ inputs.json-out }}

    - name: Upload the raw report
      if: ${{ inputs.artifact-name != '' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.artifact-name }}
        # The response report sits beside the raw report, so a results-wall intake reading
        # this artifact finds both.
        path: |
          ${{ inputs.json-out }}
          ${{ inputs.response-out }}
        retention-days: 90

    - name: Fail on a non-pass
      if: ${{ inputs.fail-on-non-pass == 'true' }}
      shell: bash
      env:
        OPERATOR_OUTCOME: ${{ steps.run.outcome }}
        RUN_OUTCOME: ${{ steps.run.outputs.outcome }}
        RUN_PASSED: ${{ steps.run.outputs.passed }}
        RESPONSE_LEAKED: ${{ steps.response.outputs.leaked }}
      run: |
        set -euo pipefail
        if [ "$OPERATOR_OUTCOME" != "skipped" ] && [ "$RUN_PASSED" != "true" ]; then
          echo "::error::Outcome $RUN_OUTCOME - see the job summary."
          exit 1
        fi
        if [ "$RESPONSE_LEAKED" = "true" ]; then
          echo "::error::The response profile saw a value reach the client - see the job summary."
          exit 1
        fi
