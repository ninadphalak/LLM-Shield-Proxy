name: PII Leak Benchmark
description: Check your gateway for upstream leaks and compare a previous version, with a job summary.
branding:
  icon: shield
  color: blue
inputs:
  target-base-url:
    description: Gateway's OpenAI-compatible /v1 URL
    required: true
  start-command:
    description: Optional foreground command to start the gateway; stopped after measurement
    default: ''
  upstream-env:
    description: Gateway environment variable that receives the benchmark capture URL
    default: ''
  target-model:
    description: Gateway model or routing alias
    default: conformance-model
  target-version:
    description: Version or commit of the gateway under test
    default: current
  duty:
    description: restore (reversible masking) or anonymize (one-way masking)
    default: restore
  profile:
    description: pii-v1 or pii-secrets-v1
    default: pii-secrets-v1
  seed:
    description: Repeatable test fixture seed; keep constant for comparisons
    default: gateway-ci-v1
  baseline-base-url:
    description: Optional previous gateway endpoint
    default: ''
  baseline-start-command:
    description: Optional foreground command for the previous gateway
    default: ''
  baseline-version:
    description: Previous gateway version or commit
    default: baseline
  baseline-report:
    description: Path to a downloaded current.json from a compatible earlier run
    default: ''
  artifact-name:
    description: Unique artifact name when invoking the action multiple times; empty skips upload
    default: pii-leak-benchmark
outputs:
  report-directory:
    description: Directory with operator reports, raw measurements and summary.md
    value: ${{ steps.setup.outputs.out }}
  python-path:
    description: Python interpreter with the pinned operator harness installed
    value: ${{ steps.setup.outputs.python }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.12'
    - id: setup
      shell: bash
      env:
        BENCHMARK_ACTION_PATH: ${{ github.action_path }}
      run: |
        work=$(mktemp -d "$RUNNER_TEMP/pii-benchmark.XXXXXXXX")
        python -m venv "$work/venv"
        if [ -x "$work/venv/bin/python" ]; then
          py="$work/venv/bin/python"
        else
          py="$work/venv/Scripts/python.exe"
        fi
        "$py" -m pip install --disable-pip-version-check "$BENCHMARK_ACTION_PATH/pii-leak-benchmark"
        echo "python=$py" >> "$GITHUB_OUTPUT"
        echo "out=$work/reports" >> "$GITHUB_OUTPUT"
    - name: Measure gateway and summarize
      shell: bash
      env:
        BENCHMARK_PYTHON: ${{ steps.setup.outputs.python }}
        BENCHMARK_OUT: ${{ steps.setup.outputs.out }}
        BENCHMARK_TARGET_BASE_URL: ${{ inputs.target-base-url }}
        BENCHMARK_START_COMMAND: ${{ inputs.start-command }}
        BENCHMARK_UPSTREAM_ENV: ${{ inputs.upstream-env }}
        BENCHMARK_TARGET_MODEL: ${{ inputs.target-model }}
        BENCHMARK_TARGET_VERSION: ${{ inputs.target-version }}
        BENCHMARK_DUTY: ${{ inputs.duty }}
        BENCHMARK_PROFILE: ${{ inputs.profile }}
        BENCHMARK_SEED: ${{ inputs.seed }}
        BENCHMARK_BASELINE_BASE_URL: ${{ inputs.baseline-base-url }}
        BENCHMARK_BASELINE_START_COMMAND: ${{ inputs.baseline-start-command }}
        BENCHMARK_BASELINE_VERSION: ${{ inputs.baseline-version }}
        BENCHMARK_BASELINE_REPORT: ${{ inputs.baseline-report }}
      run: |
        "$BENCHMARK_PYTHON" - <<'PY'
        import os
        from pii_leak_benchmark.ci import main
        flags = ['out', 'target-base-url', 'start-command', 'upstream-env', 'target-model',
                 'target-version', 'duty', 'profile', 'seed', 'baseline-base-url',
                 'baseline-start-command', 'baseline-version', 'baseline-report']
        argv = []
        for flag in flags:
            value = os.environ.get('BENCHMARK_' + flag.upper().replace('-', '_'))
            if value:
                argv.extend(['--' + flag, value])
        raise SystemExit(main(argv))
        PY
    - name: Render the result badge
      # After the measurement and on failure too: a leaking gateway is exactly the case
      # whose badge must be produced, and a step that ran only on success would emit a
      # badge for passes alone -- which is the plain Actions badge this replaces.
      #
      # Written into the reports directory, so it is uploaded with everything else and
      # needs no second artifact. Never fails the job: a missing badge is cosmetic, and
      # taking a measured run red over it would be a worse trade.
      if: always() && steps.setup.outputs.out != ''
      shell: bash
      env:
        BENCHMARK_PYTHON: ${{ steps.setup.outputs.python }}
        BENCHMARK_OUT: ${{ steps.setup.outputs.out }}
      run: |
        # `current.json`, not `current.raw.json`. The raw report is the conformance
        # measurement and carries no redaction claim on this path, so its `outcome`
        # derives as `claim-unstated` and the badge came out grey even on a measured
        # leak. `current.json` is the operator run, and its `verdict` is the number this
        # badge exists to publish.
        report="$BENCHMARK_OUT/current.json"
        if [ ! -f "$report" ]; then
          echo "No report at $report; skipping the badge."
          exit 0
        fi
        "$BENCHMARK_PYTHON" -m pii_leak_benchmark.cli badge "$report" \
          --out "$BENCHMARK_OUT/pii-leak-badge.json" || \
          echo "Badge rendering failed; the reports are unaffected."
    - name: Keep benchmark reports
      if: always() && steps.setup.outputs.out != '' && inputs.artifact-name != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.setup.outputs.out }}
        if-no-files-found: warn
