apiVersion: v1
kind: Service
metadata:
  name: llm-shield-service
spec:
  selector:
    app: llm-shield
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-shield-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-shield
  template:
    metadata:
      labels:
        app: llm-shield
    spec:
      containers:
        - name: mock-app
          image: alpine:latest
          command: ["/bin/sh", "-c"]
          args: ["apk add --no-cache curl && while true; do sleep 3600; done"]
        - name: llm-shield-proxy
          image: llm-shield-proxy:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
