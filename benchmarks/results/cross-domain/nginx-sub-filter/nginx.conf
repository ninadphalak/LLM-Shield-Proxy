# nginx sub_filter (ngx_http_sub_module): literal-string replacement with a hold-back of
# (longest pattern - 1) bytes across buffers. Expected clean. The PEM literal is injected by the
# run script (XD_PEM), because sub_filter has no regex and the key is generated per run.
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
  access_log off;
  server {
    listen 8080;
    location / {
      proxy_pass http://XD_ORIGIN_HOST:18080;
      proxy_http_version 1.1;
      proxy_set_header Accept-Encoding "";
      sub_filter_types text/plain;
      sub_filter_once off;
      sub_filter 'jane.doe@example.com' '[REDACTED]';
      sub_filter '078-05-1120' '[REDACTED]';
      sub_filter 'XD_PEM' '[REDACTED]';
    }
  }
}
