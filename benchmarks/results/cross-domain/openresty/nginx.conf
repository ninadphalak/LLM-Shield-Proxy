# Reference per-chunk redaction on OpenResty's body_filter_by_lua_block: the pattern the
# lua-nginx-module README shows (ngx.arg[1] is the current chunk, ngx.arg[2] the eof flag),
# applied the way public recipes apply it, with ngx.re.gsub on the chunk and no state.
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
  access_log off;
  server {
    listen 8080;
    location / {
      proxy_pass http://XD_ORIGIN_HOST:18080;
      proxy_http_version 1.1;
      proxy_buffering on;   # the run script also measures the "off" variant
      body_filter_by_lua_block {
        local chunk = ngx.arg[1]
        if chunk and #chunk > 0 then
          local patterns = {
            [[[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}]],
            [[\b[0-9]{3}-[0-9]{2}-[0-9]{4}\b]],
            [[-----BEGIN [A-Z ]*PRIVATE KEY-----[A-Za-z0-9+/=\r\n]+-----END [A-Z ]*PRIVATE KEY-----]],
          }
          for _, p in ipairs(patterns) do
            chunk = ngx.re.gsub(chunk, p, "[REDACTED]", "jo")
          end
          ngx.arg[1] = chunk
        end
      }
      header_filter_by_lua_block { ngx.header.content_length = nil }
    }
  }
}
