# Same pipeline with the built-in `docker` multiline parser: fragments are joined back into
# the original line before any filter runs.
[SERVICE]
    flush        1
    log_level    warn
    parsers_file /fluent-bit/etc/parsers.conf

[INPUT]
    name              tail
    path              /logs/container.log
    multiline.parser  docker
    read_from_head    true
    exit_on_eof       true
    buffer_max_size   256k
    skip_long_lines   off

[FILTER]
    name   lua
    match  *
    script /conf/redact.lua
    call   redact

[OUTPUT]
    name   stdout
    match  *
    format json_lines
