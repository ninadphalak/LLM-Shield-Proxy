replicaCount: 1

image:
  repository: llm-shield-proxy
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8000

env:
  UPSTREAM_BASE_URL: "https://api.openai.com"
  UPSTREAM_API_KEY: ""
  METRICS_BEARER_TOKEN: ""

config:
  VALID_VIRTUAL_KEYS: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
