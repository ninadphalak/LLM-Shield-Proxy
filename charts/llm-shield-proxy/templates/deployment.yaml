apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-shield-proxy.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "llm-shield-proxy.name" . }}
    helm.sh/chart: {{ include "llm-shield-proxy.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "llm-shield-proxy.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "llm-shield-proxy.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          env:
            - name: UPSTREAM_BASE_URL
              value: {{ .Values.env.UPSTREAM_BASE_URL | quote }}
            - name: UPSTREAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "llm-shield-proxy.fullname" . }}-secrets
                  key: upstream-api-key
            - name: METRICS_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "llm-shield-proxy.fullname" . }}-secrets
                  key: metrics-bearer-token
          volumeMounts:
            - name: config-volume
              mountPath: /app/config.yaml
              subPath: config.yaml
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "llm-shield-proxy.fullname" . }}-config
